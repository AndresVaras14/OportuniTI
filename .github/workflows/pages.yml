name: Publicar OportuniTI en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Consultar oportunidades oficiales
        run: npm run sync:opportunities
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}

      - name: Construir sitio estático
        run: npm run build:github

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-github

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
